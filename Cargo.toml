[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.1.6"
edition = "2024"

[workspace.dependencies]
altr-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
